# Prometheus Scrape Configuration
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "ai-risk-manager"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8000", "host.docker.internal:8000"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
