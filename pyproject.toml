[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-manager"
version = "0.1.0"
description = "AI Risk Manager: Real-Time Return-Risk Scorer & Intervention Sentinel"
readme = "README.md"
requires-python = ">=3.13,<3.15"
authors = [
    { name = "Lead Implementation Engineer" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "cachetools>=5.3.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.3",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
agents = [
    "langgraph>=1.2.0",
    "langchain>=1.4.0",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.4.0",
]
all = [
    "risk-manager[ml,agents,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["risk_manager*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
